<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>The Golden Ratio Protocol</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#08080a;color:#f0f0f2;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:520px;margin:0 auto;padding:0 0 100px;min-height:100vh;-webkit-font-smoothing:antialiased}
.hdr{padding:28px 20px 20px;border-bottom:1px solid #1a1a1e;display:flex;align-items:center;gap:14px}
.hdr img{width:52px;height:52px;border-radius:50%;border:2px solid #2a2a30;object-fit:cover}
.eye{font-size:10px;letter-spacing:3px;color:#666;font-weight:600;text-transform:uppercase;margin-bottom:2px}
.hdr h1{font-size:17px;font-weight:700;letter-spacing:1.5px}
.sub{font-size:10px;letter-spacing:2px;color:#4a4a52;font-weight:500;margin-top:3px}
.nav{display:flex;border-bottom:1px solid #1a1a1e;background:#0c0c0e}
.nav button{flex:1;padding:12px 0;background:none;border:none;border-bottom:2px solid transparent;color:#555;font-size:10px;font-weight:600;letter-spacing:2px;cursor:pointer;text-transform:uppercase;font-family:inherit}
.nav button.a{color:#f0f0f2;border-bottom-color:#f0f0f2}
.days{display:flex;gap:4px;padding:14px 16px;overflow-x:auto;background:#0c0c0e}
.day-btn{padding:8px 14px;background:#141416;color:#666;border:1px solid #1e1e22;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;white-space:nowrap;position:relative;font-family:inherit}
.day-btn.a{background:#f0f0f2;color:#08080a;border-color:#f0f0f2}
.day-dot{position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:#5cb85c}
.day-title{padding:10px 20px 6px;font-size:13px;font-weight:600;color:#888;letter-spacing:1px}
.date-row{display:flex;align-items:center;gap:10px;padding:0 20px 14px}
.date-row input{background:#111113;border:1px solid #1e1e22;color:#f0f0f2;padding:7px 12px;border-radius:4px;font-size:13px;font-family:inherit;outline:none}
.date-row span{font-size:11px;color:#333}
.autofill{padding:0 16px 10px}
.autofill button{width:100%;padding:10px;background:#141416;border:1px solid #1e1e22;border-radius:6px;color:#888;font-size:12px;font-weight:600;cursor:pointer;letter-spacing:.5px;font-family:inherit}
.card{margin:0 16px 8px;background:#111113;border:1px solid #1a1a1e;border-radius:6px;overflow:hidden}
.card-hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer;user-select:none}
.card-name{font-size:14px;font-weight:600}
.card-meta{font-size:11px;color:#555;margin-top:2px}
.tag{font-size:9px;font-weight:700;letter-spacing:1.5px;padding:2px 7px;border-radius:3px;margin-left:8px;display:inline-block}
.tag-ss{background:#1a1a3a;color:#7b8cff}
.tag-ks{background:#1a2a1a;color:#5cb85c}
.logged{color:#3a7a3a;margin-left:8px}
.chev{color:#333;font-size:16px;transition:transform .2s}
.chev.open{transform:rotate(180deg)}
.info-bar{display:flex;gap:16px;padding:8px 16px;background:#0e0e10;border-top:1px solid #141416;border-bottom:1px solid #141416;font-size:11px;color:#555}
.info-bar b{color:#888;font-weight:400}
.guide-toggle{padding:10px 16px;cursor:pointer;user-select:none;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #141416}
.guide-toggle span{font-size:11px;font-weight:600;color:#4a6a8a;letter-spacing:1px}
.guide{padding:8px 16px 12px;background:#0c0c0e}
.guide-step{display:flex;gap:8px;margin-bottom:6px}
.guide-step .n{font-size:11px;font-weight:700;color:#333;flex-shrink:0;width:16px;text-align:right}
.guide-step .t{font-size:12px;color:#888;line-height:1.5}
.set-row{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid #0e0e10}
.set-num{font-size:11px;font-weight:700;color:#333;width:32px;flex-shrink:0}
.set-num.done{color:#3a7a3a}
.inp{background:#0a0a0c;border:1px solid #1e1e22;color:#f0f0f2;padding:7px 8px;border-radius:4px;font-size:16px;font-family:inherit;width:100%;min-width:0;outline:none;text-align:center;-webkit-appearance:none;appearance:none}
.inp.filled{border-color:#2a4a2a}
.inp.pr{border-color:#8b6914}
.inp-label{font-size:9px;color:#444;text-align:center;margin-top:2px;letter-spacing:1px;text-transform:uppercase}
.bw-badge{flex:0;padding:7px 12px;font-size:12px;color:#4a4a52;font-weight:600;letter-spacing:1px;background:#0e0e10;border-radius:4px;border:1px solid #1e1e22}
.x{color:#222;font-size:14px}
.pr-label{color:#d4a017;font-weight:700}
.ss-label{padding:6px 16px 2px;display:flex;align-items:center;gap:6px}
.ss-label span:first-child{font-size:11px;font-weight:700;width:32px;flex-shrink:0}
.ss-label span:last-child{font-size:10px;font-weight:600;color:#4a4a52;letter-spacing:.5px}
.ss-inputs{display:flex;align-items:center;gap:8px;padding:2px 16px 6px;padding-left:64px}
.ss-part-label{padding:2px 16px 2px;padding-left:64px}
.ss-part-label span{font-size:10px;font-weight:600;color:#4a4a52;letter-spacing:.5px}
.ss-inputs-b{padding:2px 16px 8px;padding-left:64px;display:flex;align-items:center;gap:8px}
.rest-btn{width:100%;padding:8px;background:#0e0e10;border:1px solid #1e1e22;border-radius:4px;color:#555;font-size:11px;font-weight:600;cursor:pointer;letter-spacing:.5px;font-family:inherit;margin:0}
.rest-wrap{padding:8px 16px 12px}
.notes-box{margin:12px 16px 0;background:#111113;border:1px solid #1a1a1e;border-radius:6px;overflow:hidden}
.notes-box label{display:block;padding:10px 16px 6px;font-size:11px;font-weight:600;color:#4a4a52;letter-spacing:1px}
.notes-box textarea{width:100%;background:transparent;border:none;color:#888;padding:4px 16px 12px;font-size:13px;font-family:inherit;line-height:1.5;resize:none;outline:none;min-height:48px}
.complete-banner{margin:16px 16px 0;padding:14px;background:#1a2a1a;border:1px solid #2a4a2a;border-radius:6px;text-align:center}
.complete-banner .t{font-size:14px;font-weight:700;color:#5cb85c;letter-spacing:1px}
.complete-banner .s{font-size:11px;color:#3a7a3a;margin-top:4px}
.sec-title{padding:20px 20px 10px;font-size:12px;font-weight:700;letter-spacing:2px;color:#444;text-transform:uppercase}
.stat-grid{display:grid;gap:8px;padding:0 16px 16px}
.stat-grid.c2{grid-template-columns:1fr 1fr}
.stat-grid.c3{grid-template-columns:1fr 1fr 1fr}
.stat{background:#111113;border:1px solid #1a1a1e;border-radius:6px;padding:16px;text-align:center}
.stat .n{font-size:28px;font-weight:700;line-height:1}
.stat .l{font-size:10px;color:#555;letter-spacing:1.5px;text-transform:uppercase;margin-top:6px}
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 16px}
.photo-card{position:relative;border-radius:6px;overflow:hidden;border:1px solid #1a1a1e}
.photo-card img{width:100%;display:block}
.photo-card .overlay{position:absolute;bottom:0;left:0;right:0;padding:6px 10px;background:linear-gradient(transparent,rgba(0,0,0,.8));font-size:10px;font-weight:600;letter-spacing:1.5px;color:#aaa;text-transform:uppercase}
.photo-card .overlay-row{display:flex;justify-content:space-between;align-items:center}
.photo-card .del{background:none;border:none;color:#555;font-size:14px;cursor:pointer;padding:2px 4px;line-height:1}
.upload-label{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;background:#141416;border:1px dashed #2a2a30;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;color:#888}
.upload-label input{display:none}
.upload-limit{padding:14px;background:#141416;border:1px solid #1e1e22;border-radius:6px;text-align:center;font-size:12px;color:#555}
.empty-photos{padding:0 16px 20px;font-size:12px;color:#2a2a30;text-align:center}
.coach-desc{padding:0 16px 12px;font-size:13px;color:#666;line-height:1.6}
.photo-remind{padding:0 16px 8px;font-size:12px;color:#4a6a8a;line-height:1.5}
.export-btn{display:block;width:calc(100% - 32px);margin:20px 16px;padding:14px;background:#f0f0f2;color:#08080a;border:none;border-radius:6px;font-size:13px;font-weight:700;letter-spacing:1px;cursor:pointer;text-transform:uppercase;font-family:inherit}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal-content{background:#111113;border:1px solid #1e1e22;border-radius:8px;max-width:480px;width:100%;max-height:80vh;overflow:auto;padding:20px}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-hdr span{font-size:13px;font-weight:700;letter-spacing:1px}
.modal-hdr button{background:none;border:none;color:#555;font-size:18px;cursor:pointer}
.modal textarea{width:100%;background:#08080a;border:1px solid #1e1e22;color:#ccc;padding:14px;border-radius:6px;font-size:12px;font-family:'SF Mono','Fira Code',monospace;line-height:1.6;resize:none;outline:none;min-height:260px}
.modal .copy-btn{display:block;width:100%;margin:14px 0 0;padding:14px;background:#f0f0f2;color:#08080a;border:none;border-radius:6px;font-size:13px;font-weight:700;letter-spacing:1px;cursor:pointer;text-transform:uppercase;font-family:inherit}
.modal .hint{font-size:11px;color:#444;text-align:center;margin-top:10px}
.saved{position:fixed;top:16px;right:16px;background:#1a2a1a;border:1px solid #2a4a2a;color:#5cb85c;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:1px;z-index:50;opacity:0;transition:opacity .2s}
.saved.show{opacity:1}
.timer-float{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);border-radius:12px;padding:12px 24px;z-index:60;display:none;align-items:center;gap:16px;box-shadow:0 4px 20px rgba(0,0,0,.5);max-width:340px;width:calc(100% - 32px)}
.timer-float.active{display:flex}
.timer-float .name{font-size:10px;color:#555;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.timer-float .time{font-size:28px;font-weight:700;font-family:'SF Mono','Fira Code',monospace}
.timer-float .bar{margin-top:6px;height:3px;background:#1e1e22;border-radius:2px;overflow:hidden}
.timer-float .fill{height:100%;border-radius:2px;transition:width 1s linear}
.timer-float .close{background:none;border:none;color:#555;font-size:18px;cursor:pointer;padding:4px}
.view{display:none}.view.active{display:block}
.hidden{display:none}
.wc-card{margin:10px 16px 0;border:1px solid #1a1a1e;border-radius:8px;overflow:hidden;background:#0c0c0e}
.wc-hdr{padding:11px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:10px}
.wc-tag{font-size:9px;font-weight:700;letter-spacing:1.5px;color:#6a8c6a;background:#152015;padding:3px 7px;border-radius:3px;display:inline-block;margin-right:9px;vertical-align:middle}
.wc-card.cool .wc-tag{color:#8c7a6a;background:#1f1812}
.wc-title{font-size:11px;font-weight:600;color:#999;letter-spacing:0.5px;vertical-align:middle}
.wc-body{padding:4px 14px 12px;border-top:1px solid #1a1a1e}
.wc-item{display:flex;gap:10px;padding:9px 0;align-items:flex-start;border-bottom:1px solid #131316}
.wc-item:last-child{border-bottom:none}
.wc-n{width:20px;height:20px;border-radius:50%;background:#1a1a1e;color:#999;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.wc-c{flex:1;min-width:0}
.wc-name{font-size:12.5px;font-weight:600;color:#f0f0f2}
.wc-d{font-size:10px;color:#666;font-weight:500;letter-spacing:0.5px;margin-left:4px}
.wc-cue{font-size:11px;color:#888;margin-top:3px;line-height:1.45}
.illus{display:flex;justify-content:center;align-items:center;padding:16px 0 10px;background:#0b0b0d;border-bottom:1px solid #0e0e10}
.illus svg{width:150px;height:118px;color:#55555f}
</style>
</head>

  <div>

</div>

days:[{"id": "mon", "label": "MON", "title": "Chest + Triceps", "exercises": [{"name": "Incline Barbell Press", "sets": 4, "reps": "6–8", "muscles": "Upper Chest · Front Delts", "tempo": "3-1-1-0", "rest": "2 min", "cues": ["Set bench to 30°. Retract shoulder blades, feet planted.", "Lower bar to upper-chest / clavicle line under control.", "Elbows tucked ~45° — don't let them flare.", "Drive up powerfully, keep tension on the upper chest."]}, {"name": "Machine / Hammer Chest Press", "sets": 3, "reps": "8–10", "muscles": "Mid Chest · Triceps", "tempo": "2-1-2-0", "rest": "90s", "cues": ["Seat set so handles align with mid-chest.", "Press out and slightly in, full lockout without slamming.", "Control the negative — feel the stretch.", "Safer pressing pattern — push close to failure."]}, {"name": "Low-to-High Cable Flye / Incline Machine Press", "sets": 3, "reps": "10–15", "muscles": "Upper Chest", "tempo": "2-1-2-1", "rest": "75s", "cues": ["HIS PICK — both build the upper-chest shelf; choose by preference / gym availability.", "CABLE FLYE: pulleys low, sweep hands up to chin height, squeeze at top.", "INCLINE MACHINE PRESS: seat low, press up on an incline path, full stretch.", "Either way — chase a hard upper-chest contraction every rep."]}, {"name": "Weighted Dips", "sets": 3, "reps": "6–8", "muscles": "Lower Chest · Triceps", "tempo": "3-1-1-0", "rest": "90s", "cues": ["★ NOW LOADED — start at 25 lbs on the belt.", "Lean torso forward ~20° for chest emphasis.", "Lower until upper arms reach parallel.", "Press to lockout, don't jam the shoulders.", "All 3 sets at 8 reps → add 10 lbs next week."]}, {"name": "Rope Pushdown", "sets": 3, "reps": "12–15", "muscles": "Triceps (Lateral Head)", "tempo": "2-0-1-1", "rest": "60s", "cues": ["Elbows pinned to sides throughout.", "Push down and spread the rope at the bottom.", "Full squeeze at lockout, control the negative.", "Eric progressed these well in Month 1 — keep pushing load."]}, {"name": "Cable Kickback", "sets": 3, const DAY_DOW={mon:1,tue:2,wed:3,thu:4,sat:6};
const MAX_PHOTOS=16;
let state={view:"workout",day:"mon",date:today(),logs:{},photos:[],expanded:{},guides:{},timer:null,timerTimeout:null};

function today(){return new Date().toISOString().split("T")[0]}
function getMostRecent(dayId){const t=DAY_DOW[dayId],d=new Date(),dow=d.getDay();let diff=dow-t;if(diff<0)diff+=7;d.setDate(d.getDate()-diff);return d.toISOString().split("T")[0]}
function getAutoDay(){const d=new Date().getDay(),m={1:"mon",2:"tue",3:"wed",4:"thu",6:"sat"};return m[d]||(d===5?"thu":"sat")}
function parseRest(r){return r.includes("min")?parseInt(r)*60:parseInt(r)}
function logKey(){return state.day+":"+state.date}
function save(){localStorage.setItem("grp-logs",JSON.stringify(state.logs));flashSaved()}
function savePhotos(){localStorage.setItem("grp-photos",JSON.stringify(state.photos))}
function load(){try{const l=localStorage.getItem("grp-logs");if(l)state.logs=JSON.parse(l)}catch(e){}try{const p=localStorage.getItem("grp-photos");if(p)state.photos=JSON.parse(p)}catch(e){}}
function flashSaved(){const el=document.getElementById("saved");el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),1200)}

function initLog(day){return{day:day.id,date:state.date,notes:"",exercises:day.exercises.map(ex=>({name:ex.name,isSuperset:!!ex.parts,parts:ex.parts||null,partsBw:ex.partsBw||null,bw:ex.bw||false,sets:Array.from({length:ex.sets},()=>ex.parts?{a:{weight:"",reps:""},b:{weight:"",reps:""},aBw:ex.partsBw?.[0]||false,bBw:ex.partsBw?.[1]||false}:{weight:"",reps:"",bw:ex.bw||false})}))}}

function isSetFilled(s){if(!s.a)return s.bw?!!s.reps:!!(s.weight&&s.reps);const a=s.aBw?!!s.a.reps:!!(s.a.weight&&s.a.reps);const b=s.bBw?!!s.b.reps:!!(s.b.weight&&s.b.reps);return a&&b}
function hasSetData(s){return s.a?(s.a.weight||s.a.reps||s.b.weight||s.b.reps):(s.weight||s.reps)}
function filledCount(log,exIdx){if(!log)return 0;const ex=log.exercises[exIdx];if(!ex)return 0;return ex.sets.filter(isSetFilled).length}
function totalSessions(){return Object.values(state.logs).filter(l=>l.exercises?.some(ex=>ex.sets?.some(hasSetData))).length}
function totalSetsCount(){return Object.values(state.logs).reduce((a,l)=>a+(l.exercises?.reduce((a2,ex)=>a2+(ex.sets?.filter(isSetFilled).length||0),0)||0),0)}
function isDayComplete(dayId){const k=dayId+":"+getMostRecent(dayId);const l=state.logs[k];if(!l)return false;return l.exercises?.every(ex=>ex?.sets?.every(isSetFilled))}
function getHistMax(name){let max=0;const ck=logKey();for(const[k,l]of Object.entries(state.logs)){if(k===ck)continue;for(const ex of(l.exercises||[])){if(ex.name!==name)continue;for(const s of(ex.sets||[])){const w=parseFloat(s.weight);if(w>max)max=w}}}return max}
function isNewPR(name,w){const v=parseFloat(w);return v>0&&v>getHistMax(name)}
function getLastSession(dayId){const ck=logKey();const keys=Object.keys(state.logs).filter(k=>k.startsWith(dayId+":")&&k!==ck).sort().reverse();return keys.length?state.logs[keys[0]]:null}

function updateSet(exIdx,setIdx,field,value,part){
  const day=PROGRAM.days.find(d=>d.id===state.day);const k=logKey();
  if(!state.logs[k])state.logs[k]=initLog(day);
  const s=state.logs[k].exercises[exIdx].sets[setIdx];
  if(part)s[part][field]=value;else s[field]=value;
  save()
}
function updateNotes(v){
  const day=PROGRAM.days.find(d=>d.id===state.day);const k=logKey();
  if(!state.logs[k])state.logs[k]=initLog(day);
  state.logs[k].notes=v;save()
}
function autoFill(){
  const day=PROGRAM.days.find(d=>d.id===state.day);const last=getLastSession(state.day);if(!last)return;
  const k=logKey();if(!state.logs[k])state.logs[k]=initLog(day);
  state.logs[k].exercises=state.logs[k].exercises.map((ex,i)=>{const le=last.exercises?.[i];if(!le)return ex;return{...ex,sets:JSON.parse(JSON.stringify(le.sets))}});
  save();render()
}

// Timer — timestamp-based so it survives phone screen lock / app backgrounding
function saveTimer(){if(state.timer)localStorage.setItem("grp-timer",JSON.stringify(state.timer));else localStorage.removeItem("grp-timer")}
function loadTimer(){try{const t=localStorage.getItem("grp-timer");if(t){state.timer=JSON.parse(t);if(timerRemaining()<=-60){state.timer=null;localStorage.removeItem("grp-timer")}else{scheduleTick()}}}catch(e){}}
function timerRemaining(){if(!state.timer)return 0;return state.timer.total-(Date.now()-state.timer.startTime)/1000}
function startTimer(name,rest){
  clearTimeout(state.timerTimeout);
  const secs=parseRest(rest);
  state.timer={name,total:secs,startTime:Date.now()};
  saveTimer();
  scheduleTick();
  renderTimer()
}
function cancelTimer(){clearTimeout(state.timerTimeout);state.timer=null;saveTimer();renderTimer()}
function startTimerByIdx(idx){const ex=PROGRAM.days.find(d=>d.id===state.day).exercises[idx];startTimer(ex.name,ex.rest)}
function scheduleTick(){
  clearTimeout(state.timerTimeout);
  if(!state.timer)return;
  const rem=timerRemaining();
  if(rem<=-1)return; // stop scheduling once well past zero
  // Align to next whole-second boundary
  const ms=((rem%1)*1000)||1000;
  state.timerTimeout=setTimeout(()=>{renderTimer();scheduleTick()},Math.max(50,ms))
}
function renderTimer(){
  const el=document.getElementById("timer-float");
  if(!state.timer){el.classList.remove("active");return}
  el.classList.add("active");
  const rem=timerRemaining();const done=rem<=0;const display=Math.max(0,Math.ceil(rem));
  el.style.background=done?"#1a2a1a":"#141416";
  el.style.border="1px solid "+(done?"#2a4a2a":"#2a2a30");
  document.getElementById("timer-name").textContent=state.timer.name;
  const timeEl=document.getElementById("timer-time");
  timeEl.textContent=done?"GO!":`${Math.floor(display/60)}:${(display%60).toString().padStart(2,"0")}`;

// Photo upload
function handlePhoto(input){
  const file=input.files?.[0];if(!file)return;
  if(state.photos.length>=MAX_PHOTOS){alert("Photo limit reached ("+MAX_PHOTOS+").");input.value="";return}
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();img.onload=()=>{
      const canvas=document.createElement("canvas");const max=600;let w=img.width,h=img.height;
      if(w>h){if(w>max){h=h*max/w;w=max}}else{if(h>max){w=w*max/h;h=max}}
      canvas.width=w;canvas.height=h;canvas.getContext("2d").drawImage(img,0,0,w,h);
      state.photos.unshift({id:Date.now().toString(),date:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}),data:canvas.toDataURL("image/jpeg",.6)});
      savePhotos();render()
    };img.src=e.target.result
  };reader.readAsDataURL(file);input.value=""
}
function deletePhoto(id){if(!confirm("Delete this photo?"))return;state.photos=state.photos.filter(p=>p.id!==id);savePhotos();render()}

// Export
function generateExport(){
  let t=`GOLDEN RATIO PROTOCOL — MONTH ${PROGRAM.month} LOG\nClient: Eric\nExported: ${new Date().toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}\nSessions: ${totalSessions()} | Sets Logged: ${totalSetsCount()} | Progress Photos: ${state.photos.length}\n${"═".repeat(46)}\n\n`;
  const sorted=Object.keys(state.logs).sort();let has=false;
  for(const key of sorted){
    const log=state.logs[key];const di=PROGRAM.days.find(d=>d.id===log.day);if(!di)continue;
    if(!log.exercises?.some(ex=>ex.sets?.some(hasSetData)))continue;has=true;
    t+=`${di.label} — ${di.title}  [${log.date}]\n${"-".repeat(42)}\n`;
    if(log.notes)t+=`  Notes: ${log.notes}\n`;
    for(const ex of log.exercises){
      const done=ex.sets?.filter(hasSetData);if(!done?.length)continue;t+=`  ${ex.name}\n`;
      done.forEach((s,i)=>{
        if(s.a){
          const p=ex.parts||["A","B"];
          const aS=s.aBw?`BW × ${s.a.reps||"—"} reps`:`${s.a.weight||"—"} lbs × ${s.a.reps||"—"} reps`;
          const bS=s.bBw?`BW × ${s.b.reps||"—"} reps`:`${s.b.weight||"—"} lbs × ${s.b.reps||"—"} reps`;
          t+=`    Set ${i+1}: ${p[0]}: ${aS}\n           ${p[1]}: ${bS}\n`
        }else{t+=`    Set ${i+1}: ${s.bw?"BW":(s.weight||"—")+" lbs"} × ${s.reps||"—"} reps\n`}
      })
    }
    t+="\n"
  }
  if(!has)t+="No sessions logged yet.\n";
  if(state.photos.length>0)t+=`${"═".repeat(46)}\n📸 ${state.photos.length} progress photo${state.photos.length!==1?"s":""} taken this month.\nRemember to send your progress photos to your coach along with this summary.\n`;
  showModal(t)
}

function copyExport(btn){

}

function renderExport(){
  const ts=totalSessions(),tsets=totalSetsCount();
  let h=`<div class="sec-title">Send to Coach</div><div class="coach-desc">Export your training log so your coach can review your progress and build your next month's program.</div>`;
  h+=`<div class="stat-grid c3"><div class="stat"><div class="n">${ts}</div><div class="l">Sessions</div></div><div class="stat"><div class="n">${tsets}</div><div class="l">Sets</div></div><div class="stat"><div class="n">${state.photos.length}</div><div class="l">Photos</div></div></div>`;
  if(state.photos.length>0)h+=`<div class="photo-remind">📸 Remember to send your ${state.photos.length} progress photo${state.photos.length!==1?"s":""} to your coach along with the summary below.</div>`;
  h+=`<button class="export-btn" onclick="generateExport()">Generate Coach Summary</button>`;
  document.getElementById("view-export").innerHTML=h
}

function setDay(id){state.day=id;state.date=getMostRecent(id);state.expanded={};state.guides={};render()}
function setDate(v){state.date=v;render()}
function toggle(id){state.expanded[id]=!state.expanded[id];render()}
function toggleGuide(id){state.guides[id]=!state.guides[id];render()}

// Init
state.day=getAutoDay();state.date=getMostRecent(state.day);
load();loadTimer();render();
