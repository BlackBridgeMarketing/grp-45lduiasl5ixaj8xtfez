<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>The Golden Ratio Protocol</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#08080a;color:#f0f0f2;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:520px;margin:0 auto;padding:0 0 100px;min-height:100vh;-webkit-font-smoothing:antialiased}
.hdr{padding:28px 20px 20px;border-bottom:1px solid #1a1a1e;display:flex;align-items:center;gap:14px}
.hdr img{width:52px;height:52px;border-radius:50%;border:2px solid #2a2a30;object-fit:cover}
.eye{font-size:10px;letter-spacing:3px;color:#666;font-weight:600;text-transform:uppercase;margin-bottom:2px}
.hdr h1{font-size:17px;font-weight:700;letter-spacing:1.5px}
.sub{font-size:10px;letter-spacing:2px;color:#4a4a52;font-weight:500;margin-top:3px}
.nav{display:flex;border-bottom:1px solid #1a1a1e;background:#0c0c0e}
.nav button{flex:1;padding:12px 0;background:none;border:none;border-bottom:2px solid transparent;color:#555;font-size:10px;font-weight:600;letter-spacing:2px;cursor:pointer;text-transform:uppercase;font-family:inherit}
.nav button.a{color:#f0f0f2;border-bottom-color:#f0f0f2}
.days{display:flex;gap:4px;padding:14px 16px;overflow-x:auto;background:#0c0c0e}
.day-btn{padding:8px 14px;background:#141416;color:#666;border:1px solid #1e1e22;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;white-space:nowrap;position:relative;font-family:inherit}
.day-btn.a{background:#f0f0f2;color:#08080a;border-color:#f0f0f2}
.day-dot{position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:#5cb85c}
.day-title{padding:10px 20px 6px;font-size:13px;font-weight:600;color:#888;letter-spacing:1px}
.date-row{display:flex;align-items:center;gap:10px;padding:0 20px 14px}
.date-row input{background:#111113;border:1px solid #1e1e22;color:#f0f0f2;padding:7px 12px;border-radius:4px;font-size:13px;font-family:inherit;outline:none}
.date-row span{font-size:11px;color:#333}
.autofill{padding:0 16px 10px}
.autofill button{width:100%;padding:10px;background:#141416;border:1px solid #1e1e22;border-radius:6px;color:#888;font-size:12px;font-weight:600;cursor:pointer;letter-spacing:.5px;font-family:inherit}
.card{margin:0 16px 8px;background:#111113;border:1px solid #1a1a1e;border-radius:6px;overflow:hidden}
.card-hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer;user-select:none}
.card-name{font-size:14px;font-weight:600}
.card-meta{font-size:11px;color:#555;margin-top:2px}
.tag{font-size:9px;font-weight:700;letter-spacing:1.5px;padding:2px 7px;border-radius:3px;margin-left:8px;display:inline-block}
.tag-ss{background:#1a1a3a;color:#7b8cff}
.tag-ks{background:#1a2a1a;color:#5cb85c}
.logged{color:#3a7a3a;margin-left:8px}
.chev{color:#333;font-size:16px;transition:transform .2s}
.chev.open{transform:rotate(180deg)}
.info-bar{display:flex;gap:16px;padding:8px 16px;background:#0e0e10;border-top:1px solid #141416;border-bottom:1px solid #141416;font-size:11px;color:#555}
.info-bar b{color:#888;font-weight:400}
.guide-toggle{padding:10px 16px;cursor:pointer;user-select:none;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #141416}
.guide-toggle span{font-size:11px;font-weight:600;color:#4a6a8a;letter-spacing:1px}
.guide{padding:8px 16px 12px;background:#0c0c0e}
.guide-step{display:flex;gap:8px;margin-bottom:6px}
.guide-step .n{font-size:11px;font-weight:700;color:#333;flex-shrink:0;width:16px;text-align:right}
.guide-step .t{font-size:12px;color:#888;line-height:1.5}
.set-row{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid #0e0e10}
.set-num{font-size:11px;font-weight:700;color:#333;width:32px;flex-shrink:0}
.set-num.done{color:#3a7a3a}
.inp{background:#0a0a0c;border:1px solid #1e1e22;color:#f0f0f2;padding:7px 8px;border-radius:4px;font-size:16px;font-family:inherit;width:100%;min-width:0;outline:none;text-align:center;-webkit-appearance:none;appearance:none}
.inp.filled{border-color:#2a4a2a}
.inp.pr{border-color:#8b6914}
.inp-label{font-size:9px;color:#444;text-align:center;margin-top:2px;letter-spacing:1px;text-transform:uppercase}
.bw-badge{flex:0;padding:7px 12px;font-size:12px;color:#4a4a52;font-weight:600;letter-spacing:1px;background:#0e0e10;border-radius:4px;border:1px solid #1e1e22}
.x{color:#222;font-size:14px}
.pr-label{color:#d4a017;font-weight:700}
.ss-label{padding:6px 16px 2px;display:flex;align-items:center;gap:6px}
.ss-label span:first-child{font-size:11px;font-weight:700;width:32px;flex-shrink:0}
.ss-label span:last-child{font-size:10px;font-weight:600;color:#4a4a52;letter-spacing:.5px}
.ss-inputs{display:flex;align-items:center;gap:8px;padding:2px 16px 6px;padding-left:64px}
.ss-part-label{padding:2px 16px 2px;padding-left:64px}
.ss-part-label span{font-size:10px;font-weight:600;color:#4a4a52;letter-spacing:.5px}
.ss-inputs-b{padding:2px 16px 8px;padding-left:64px;display:flex;align-items:center;gap:8px}
.rest-btn{width:100%;padding:8px;background:#0e0e10;border:1px solid #1e1e22;border-radius:4px;color:#555;font-size:11px;font-weight:600;cursor:pointer;letter-spacing:.5px;font-family:inherit;margin:0}
.rest-wrap{padding:8px 16px 12px}
.notes-box{margin:12px 16px 0;background:#111113;border:1px solid #1a1a1e;border-radius:6px;overflow:hidden}
.notes-box label{display:block;padding:10px 16px 6px;font-size:11px;font-weight:600;color:#4a4a52;letter-spacing:1px}
.notes-box textarea{width:100%;background:transparent;border:none;color:#888;padding:4px 16px 12px;font-size:13px;font-family:inherit;line-height:1.5;resize:none;outline:none;min-height:48px}
.complete-banner{margin:16px 16px 0;padding:14px;background:#1a2a1a;border:1px solid #2a4a2a;border-radius:6px;text-align:center}
.complete-banner .t{font-size:14px;font-weight:700;color:#5cb85c;letter-spacing:1px}
.complete-banner .s{font-size:11px;color:#3a7a3a;margin-top:4px}
.sec-title{padding:20px 20px 10px;font-size:12px;font-weight:700;letter-spacing:2px;color:#444;text-transform:uppercase}
.stat-grid{display:grid;gap:8px;padding:0 16px 16px}
.stat-grid.c2{grid-template-columns:1fr 1fr}
.stat-grid.c3{grid-template-columns:1fr 1fr 1fr}
.stat{background:#111113;border:1px solid #1a1a1e;border-radius:6px;padding:16px;text-align:center}
.stat .n{font-size:28px;font-weight:700;line-height:1}
.stat .l{font-size:10px;color:#555;letter-spacing:1.5px;text-transform:uppercase;margin-top:6px}
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 16px}
.photo-card{position:relative;border-radius:6px;overflow:hidden;border:1px solid #1a1a1e}
.photo-card img{width:100%;display:block}
.photo-card .overlay{position:absolute;bottom:0;left:0;right:0;padding:6px 10px;background:linear-gradient(transparent,rgba(0,0,0,.8));font-size:10px;font-weight:600;letter-spacing:1.5px;color:#aaa;text-transform:uppercase}
.photo-card .overlay-row{display:flex;justify-content:space-between;align-items:center}
.photo-card .del{background:none;border:none;color:#555;font-size:14px;cursor:pointer;padding:2px 4px;line-height:1}
.upload-label{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;background:#141416;border:1px dashed #2a2a30;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;color:#888}
.upload-label input{display:none}
.upload-limit{padding:14px;background:#141416;border:1px solid #1e1e22;border-radius:6px;text-align:center;font-size:12px;color:#555}
.empty-photos{padding:0 16px 20px;font-size:12px;color:#2a2a30;text-align:center}
.coach-desc{padding:0 16px 12px;font-size:13px;color:#666;line-height:1.6}
.photo-remind{padding:0 16px 8px;font-size:12px;color:#4a6a8a;line-height:1.5}
.export-btn{display:block;width:calc(100% - 32px);margin:20px 16px;padding:14px;background:#f0f0f2;color:#08080a;border:none;border-radius:6px;font-size:13px;font-weight:700;letter-spacing:1px;cursor:pointer;text-transform:uppercase;font-family:inherit}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal-content{background:#111113;border:1px solid #1e1e22;border-radius:8px;max-width:480px;width:100%;max-height:80vh;overflow:auto;padding:20px}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-hdr span{font-size:13px;font-weight:700;letter-spacing:1px}
.modal-hdr button{background:none;border:none;color:#555;font-size:18px;cursor:pointer}
.modal textarea{width:100%;background:#08080a;border:1px solid #1e1e22;color:#ccc;padding:14px;border-radius:6px;font-size:12px;font-family:'SF Mono','Fira Code',monospace;line-height:1.6;resize:none;outline:none;min-height:260px}
.modal .copy-btn{display:block;width:100%;margin:14px 0 0;padding:14px;background:#f0f0f2;color:#08080a;border:none;border-radius:6px;font-size:13px;font-weight:700;letter-spacing:1px;cursor:pointer;text-transform:uppercase;font-family:inherit}
.modal .hint{font-size:11px;color:#444;text-align:center;margin-top:10px}
.saved{position:fixed;top:16px;right:16px;background:#1a2a1a;border:1px solid #2a4a2a;color:#5cb85c;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:1px;z-index:50;opacity:0;transition:opacity .2s}
.saved.show{opacity:1}
.timer-float{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);border-radius:12px;padding:12px 24px;z-index:60;display:none;align-items:center;gap:16px;box-shadow:0 4px 20px rgba(0,0,0,.5);max-width:340px;width:calc(100% - 32px)}
.timer-float.active{display:flex}
.timer-float .name{font-size:10px;color:#555;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.timer-float .time{font-size:28px;font-weight:700;font-family:'SF Mono','Fira Code',monospace}
.timer-float .bar{margin-top:6px;height:3px;background:#1e1e22;border-radius:2px;overflow:hidden}
.timer-float .fill{height:100%;border-radius:2px;transition:width 1s linear}
.timer-float .close{background:none;border:none;color:#555;font-size:18px;cursor:pointer;padding:4px}
.view{display:none}.view.active{display:block}
.hidden{display:none}
.wc-card{margin:10px 16px 0;border:1px solid #1a1a1e;border-radius:8px;overflow:hidden;background:#0c0c0e}
.wc-hdr{padding:11px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:10px}
.wc-tag{font-size:9px;font-weight:700;letter-spacing:1.5px;color:#6a8c6a;background:#152015;padding:3px 7px;border-radius:3px;display:inline-block;margin-right:9px;vertical-align:middle}
.wc-card.cool .wc-tag{color:#8c7a6a;background:#1f1812}
.wc-title{font-size:11px;font-weight:600;color:#999;letter-spacing:0.5px;vertical-align:middle}
.wc-body{padding:4px 14px 12px;border-top:1px solid #1a1a1e}
.wc-item{display:flex;gap:10px;padding:9px 0;align-items:flex-start;border-bottom:1px solid #131316}
.wc-item:last-child{border-bottom:none}
.wc-n{width:20px;height:20px;border-radius:50%;background:#1a1a1e;color:#999;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.wc-c{flex:1;min-width:0}
.wc-name{font-size:12.5px;font-weight:600;color:#f0f0f2}
.wc-d{font-size:10px;color:#666;font-weight:500;letter-spacing:0.5px;margin-left:4px}
.wc-cue{font-size:11px;color:#888;margin-top:3px;line-height:1.45}
.illus{display:flex;justify-content:center;align-items:center;padding:16px 0 10px;background:#0b0b0d;border-bottom:1px solid #0e0e10}
.illus svg{width:150px;height:118px;color:#55555f}
</style>
</head>

</div>

days:[{"id":"mon","label":"MON","title":"Upper A · Upper Chest + Lats","exercises":[{"name":"Low-Incline DB Press","sets":3,"reps":"6–10","muscles":"Upper Chest · Triceps","tempo":"3-1-1-0","rest":"2–3 min","cues":["★ NEW — replaces the incline barbell. Bench on the 1st or 2nd notch (15–30°), NOT 45°. The low angle hits the upper chest while keeping the front delts quieter.","Start around 45–50 lb DBs. Find the weight you can do 8 clean reps with.","Shoulder blades pinned back and down, feet planted.","Lower for 3 seconds to the upper chest, elbows about 45° from your sides.","Press up and slightly in. All 3 sets at 10 → go up 5 lbs per DB."]},{"name":"Weighted Neutral-Grip Pull-Up","sets":4,"reps":"3–5","muscles":"Lats · Upper Back · Biceps","tempo":"2-1-1-0","rest":"2–3 min","cues":["★ Start at 40 lbs. Heavy, low-rep strength work for lat width.","Full dead hang at the bottom of every rep — no half reps.","Drive the elbows down toward your ribs, chest up to the bar.","Lower under control for 2 seconds.","All 4 sets at 5 reps → go to 45 lbs and start back at 3s."]},{"name":"Low-to-High Cable Flye","sets":3,"reps":"12–15","muscles":"Upper Chest","tempo":"2-0-2-1","rest":"60–90s","cues":["Start at 30 lbs. Pulleys at the lowest setting, D-handles, staggered stance.","Slight bend in the elbows, locked the whole time.","Sweep the hands up and together to chin height.","Squeeze the upper chest 1 second at the top, slow on the way down.","All 3 sets at 15 → add 2.5–5 lbs."]},{"name":"Wide-Grip Lat Pulldown","sets":3,"reps":"8–12","muscles":"Lats (Width)","tempo":"2-1-2-1","rest":"90s","cues":["Start at 150 lbs.","Grip wider than shoulders, chest tall, slight lean back.","Pull the bar to the upper chest, elbows down and back.","Pause at the bottom, then control the bar all the way up for a full lat stretch.","All 3 sets at 12 → add 10 lbs."]},{"name":"Straight-Arm Cable Pulldown","sets":2,"reps":"12–15","muscles":"Lats (Lower / Outer)","tempo":"3-0-2-1","rest":"60s","cues":["★ NEW. High cable, straight bar or rope. Step back 2–3 feet and hinge forward slightly with a flat back.","Arms straight with a soft bend in the elbows — keep that bend locked the whole set.","Sweep the bar down in an arc to your thighs. Think: push the bar to your pockets.","Squeeze the lats 1 second at the bottom, then let the bar rise slowly for 3 seconds.","Find a weight for 15 clean reps. If your elbows start bending, it is too heavy."]},{"name":"Reverse Pec Deck","sets":3,"reps":"15","muscles":"Rear Delts · Mid Back","tempo":"2-1-2-1","rest":"60s","cues":["★ REAR DELT PRIORITY — session 1 of 3 this week. Start at 90 lbs.","Chest against the pad, handles at shoulder height, palms down.","Sweep the arms out and back in a wide arc. Lead with the backs of the hands.","Pause 1 second. Keep the shoulder blades still — move at the shoulder, don't pinch.","All 3 sets at 15 → add one plate."]},{"name":"Hanging Leg Raise + Hollow Rock","sets":3,"reps":"12 + 20","muscles":"Lower Abs · Core","tempo":"Controlled","rest":"60s after pair","cues":["★ AB FINISHER (1 of 2 this week).","HANGING LEG RAISE: curl the pelvis up as the legs rise. No swinging.","Straight into HOLLOW ROCKS: lower back pressed down, rock as one rigid banana shape.","Rest only after finishing both movements."],"tag":"SUPERSET","parts":["Hanging Leg Raise","Hollow Rock"],"partsBw":[true,true]}]},{"id":"tue","label":"TUE","title":"Lower A · Glutes + Arms","exercises":[{"name":"Barbell Hip Thrust","sets":4,"reps":"8–12","muscles":"Glutes · Hamstrings","tempo":"2-0-1-1","rest":"2 min","cues":["Start at 365 lbs. Upper back on the bench edge, bar padded over the hips.","Feet flat, shins vertical at the top. Chin tucked, ribs down.","Drive through the heels until the hips are level with the knees and shoulders.","Squeeze the glutes 1 second at the top — don't arch the lower back.","All 4 sets at 12 → add 10 lbs."]},{"name":"Single-Leg Romanian Deadlift","sets":3,"reps":"8–12 /leg","muscles":"Hamstrings · Glutes · Balance","tempo":"3-1-1-0","rest":"90s","cues":["Start at 50 lbs. Dumbbell in the hand opposite the working leg.","Soft bend in the standing knee — it stays still the whole rep.","Hinge at the hip. The back leg reaches straight behind you, hips square to the floor.","Lower until you feel a deep hamstring stretch, then drive the hip forward to stand.","All sets at 12 on both legs → add 5 lbs."]},{"name":"45° Back Extension","sets":3,"reps":"12–15","muscles":"Glutes · Hamstrings","tempo":"2-0-2-1","rest":"60–90s","cues":["Start holding a 20 lb plate to your chest.","Pad just below the hip bones so you can hinge freely.","Chin tucked, upper back slightly rounded the whole time.","Hinge down to a hamstring stretch, then squeeze the glutes up to a straight line.","Stop at straight — no arching at the top. All sets at 15 → add 5 lbs."]},{"name":"Standing Calf Raise","sets":4,"reps":"12–15","muscles":"Calves","tempo":"2-2-1-1","rest":"60s","cues":["Start at 155 lbs. Balls of the feet on the edge, knees straight but not locked.","Lower slowly and hold the bottom stretch for 2 seconds — no bouncing.","Rise as high as possible, squeeze 1 second at the top.","All 4 sets at 15 → add 10 lbs."]},{"name":"Incline DB Curl + Rope Pushdown","sets":3,"reps":"10–12 each","muscles":"Biceps (Long Head) · Triceps","tempo":"2-0-2-1","rest":"60s after pair","cues":["★ ARM SUPERSET — go straight from the curl to the pushdown. Rest only after both.","INCLINE DB CURL: start at 25 lbs. Bench at 45–60°, arms hang straight down behind your body.","Curl without letting the elbows drift forward. Lower slowly to a full stretch.","ROPE PUSHDOWN: ★ NEW WEIGHT — find a weight you can do 12 STRICT reps with. Expect it to be lighter than before.","Stand upright, elbows pinned to your sides. Spread the rope apart at the bottom, slow on the way up.","Hit 12 on every set → add weight next session."],"tag":"SUPERSET","parts":["Incline DB Curl","Rope Pushdown"],"partsBw":[false,false]},{"name":"Hammer Curl + Single-Arm Cable Kickback","sets":3,"reps":"8–12 + 12–15","muscles":"Brachialis · Forearms · Triceps (Long Head)","tempo":"2-0-2-1","rest":"60s after pair","cues":["HAMMER CURL: start at 30 lbs. Neutral grip, curl to the shoulder, no swinging.","Squeeze at the top, lower under control.","SINGLE-ARM CABLE KICKBACK: start at 30 lbs. Hinge forward, upper arm parallel to the floor.","Extend from the elbow only, squeeze 1 second at full extension.","Hammer at 12 → add 5 lbs. Kickback at 15 → add 2.5 lbs."],"tag":"SUPERSET","parts":["Hammer Curl","Single-Arm Cable Kickback"],"partsBw":[false,false]}]},{"id":"thu","label":"THU","title":"Upper B · Upper Back + Traps","exercises":[{"name":"Low-Incline Smith Machine Press","sets":3,"reps":"6–10","muscles":"Upper Chest · Triceps","tempo":"3-1-1-0","rest":"2–3 min","cues":["★ NEW. Bench on the 1st or 2nd notch (15–30°) under the Smith bar.","The bar should touch your upper chest just below the collarbones — move the bench until it does.","Shoulder blades pinned back, elbows about 45° from your sides.","Lower for 3 seconds, press up powerfully.","Find a weight you can do 8 clean reps with. All 3 sets at 10 → add 10 lbs."]},{"name":"Chest-Supported Row","sets":4,"reps":"8–12","muscles":"Mid Back · Rhomboids · Mid Traps","tempo":"2-1-2-0","rest":"2 min","cues":["★ NEW — replaces the T-bar row. Start at 50 lbs. Your chest stays on the pad the whole set.","Elbows out about 45° from your body.","Row until the elbows pass your torso, squeeze the shoulder blades together for 1 second.","Lower to a full stretch without lifting your chest off the pad.","All 4 sets at 12 → add 5–10 lbs."]},{"name":"Single-Arm Cable Row","sets":3,"reps":"10–12 /arm","muscles":"Lats · Mid Back","tempo":"2-1-2-1","rest":"90s","cues":["Start at 100 lbs. Split stance, pull the handle to your hip.","Let the shoulder stretch forward at the start of each rep.","Drive the elbow back and squeeze the lat.","Do your weaker side first, then match the reps on the other side.","All sets at 12 → add 10 lbs."]},{"name":"Incline DB Flye","sets":3,"reps":"10–12","muscles":"Upper Chest","tempo":"3-0-2-1","rest":"90s","cues":["★ NEW. Bench on the 1st or 2nd notch (15–30°).","Start light — find a weight you can do 12 clean reps with.","Slight bend in the elbows, locked the whole time. Palms facing each other.","Open the arms wide until you feel a deep chest stretch, lowering for 3 seconds.","Bring the DBs together over the upper chest and squeeze. If you feel it in the front of the shoulder, go lighter."]},{"name":"Heavy DB Shrugs","sets":3,"reps":"10–12","muscles":"Upper Traps","tempo":"2-1-2-1","rest":"90s","cues":["★ TRAP PRIORITY — your one heavy shrug day. Start at 80 lbs.","Stand tall, DBs at your sides, arms straight.","Shrug straight up toward the ears — no rolling.","Hold the top 1 second, lower slowly to a full stretch.","All 3 sets at 12 → add 5 lbs per DB."]},{"name":"Cable Lateral Raise","sets":3,"reps":"12–15 /arm","muscles":"Side Delts (Width)","tempo":"2-1-2-0","rest":"60s","cues":["★ #1 WIDTH BUILDER. Start at 15 lbs — STRICT form only.","Cable at the lowest setting, handle in the far hand, cable crossing in front of your body.","Lead with the elbow and raise out to the side to shoulder height — no higher.","No swinging or leaning. Lower slowly for 2 seconds.","All 3 sets at 15 → add 2.5 lbs."]},{"name":"Rear Delt Cable Flye","sets":3,"reps":"15","muscles":"Rear Delts","tempo":"2-1-2-1","rest":"60s","cues":["★ REAR DELT PRIORITY — session 2 of 3. Start at 15 lbs.","Pulleys at shoulder height, cables crossed: left hand holds the right cable, right hand the left.","Arms nearly straight, sweep out and back into a T.","Pause 1 second. Don't pinch the shoulder blades. Slow return.","All 3 sets at 15 → add 2.5 lbs."]}]},{"id":"sat","label":"SAT","title":"Lower B · Quads + Arms","exercises":[{"name":"Hack Squat","sets":3,"reps":"10–12","muscles":"Quads · Glutes","tempo":"3-1-1-0","rest":"2 min","cues":["Start at 70 lbs. F const DAY_DOW={mon:1,tue:2,thu:4,sat:6};
const MAX_PHOTOS=16;
let state={view:"workout",day:"mon",date:today(),logs:{},photos:[],expanded:{},guides:{},timer:null,timerTimeout:null};

function today(){return new Date().toISOString().split("T")[0]}
function getMostRecent(dayId){const t=DAY_DOW[dayId],d=new Date(),dow=d.getDay();let diff=dow-t;if(diff<0)diff+=7;d.setDate(d.getDate()-diff);return d.toISOString().split("T")[0]}
function getAutoDay(){const d=new Date().getDay(),m={1:"mon",2:"tue",4:"thu",6:"sat"};return m[d]||(d===3?"tue":d===5?"thu":"sat")}
function parseRest(r){return r.includes("min")?parseInt(r)*60:parseInt(r)}
function logKey(){return state.day+":"+state.date}
function save(){localStorage.setItem("grp-m4-logs",JSON.stringify(state.logs));flashSaved()}
function savePhotos(){localStorage.setItem("grp-photos",JSON.stringify(state.photos))}
function load(){try{const l=localStorage.getItem("grp-m4-logs");if(l)state.logs=JSON.parse(l)}catch(e){}try{const p=localStorage.getItem("grp-photos");if(p)state.photos=JSON.parse(p)}catch(e){}}
function flashSaved(){const el=document.getElementById("saved");el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),1200)}

function initLog(day){return{day:day.id,date:state.date,notes:"",exercises:day.exercises.map(ex=>({name:ex.name,isSuperset:!!ex.parts,parts:ex.parts||null,partsBw:ex.partsBw||null,bw:ex.bw||false,sets:Array.from({length:ex.sets},()=>ex.parts?{a:{weight:"",reps:""},b:{weight:"",reps:""},aBw:ex.partsBw?.[0]||false,bBw:ex.partsBw?.[1]||false}:{weight:"",reps:"",bw:ex.bw||false})}))}}

function isSetFilled(s){if(!s.a)return s.bw?!!s.reps:!!(s.weight&&s.reps);const a=s.aBw?!!s.a.reps:!!(s.a.weight&&s.a.reps);const b=s.bBw?!!s.b.reps:!!(s.b.weight&&s.b.reps);return a&&b}
function hasSetData(s){return s.a?(s.a.weight||s.a.reps||s.b.weight||s.b.reps):(s.weight||s.reps)}
function filledCount(log,exIdx){if(!log)return 0;const ex=log.exercises[exIdx];if(!ex)return 0;return ex.sets.filter(isSetFilled).length}
function totalSessions(){return Object.values(state.logs).filter(l=>l.exercises?.some(ex=>ex.sets?.some(hasSetData))).length}
function totalSetsCount(){return Object.values(state.logs).reduce((a,l)=>a+(l.exercises?.reduce((a2,ex)=>a2+(ex.sets?.filter(isSetFilled).length||0),0)||0),0)}
function isDayComplete(dayId){const k=dayId+":"+getMostRecent(dayId);const l=state.logs[k];if(!l)return false;return l.exercises?.every(ex=>ex?.sets?.every(isSetFilled))}
function getHistMax(name){let max=0;const ck=logKey();for(const[k,l]of Object.entries(state.logs)){if(k===ck)continue;for(const ex of(l.exercises||[])){if(ex.name!==name)continue;for(const s of(ex.sets||[])){const w=parseFloat(s.weight);if(w>max)max=w}}}return max}
function isNewPR(name,w){const v=parseFloat(w);return v>0&&v>getHistMax(name)}
function getLastSession(dayId){const ck=logKey();const keys=Object.keys(state.logs).filter(k=>k.startsWith(dayId+":")&&k!==ck).sort().reverse();return keys.length?state.logs[keys[0]]:null}

function updateSet(exIdx,setIdx,field,value,part){
  const day=PROGRAM.days.find(d=>d.id===state.day);const k=logKey();
  if(!state.logs[k])state.logs[k]=initLog(day);
  const s=state.logs[k].exercises[exIdx].sets[setIdx];
  if(part)s[part][field]=value;else s[field]=value;
  save()
}
function updateNotes(v){
  const day=PROGRAM.days.find(d=>d.id===state.day);const k=logKey();
  if(!state.logs[k])state.logs[k]=initLog(day);
  state.logs[k].notes=v;save()
}
function autoFill(){
  const day=PROGRAM.days.find(d=>d.id===state.day);const last=getLastSession(state.day);if(!last)return;
  const k=logKey();if(!state.logs[k])state.logs[k]=initLog(day);
  state.logs[k].exercises=state.logs[k].exercises.map((ex,i)=>{const le=last.exercises?.[i];if(!le)return ex;return{...ex,sets:JSON.parse(JSON.stringify(le.sets))}});
  save();render()
}

// Timer — timestamp-based so it survives phone screen lock / app backgrounding
function saveTimer(){if(state.timer)localStorage.setItem("grp-timer",JSON.stringify(state.timer));else localStorage.removeItem("grp-timer")}
function loadTimer(){try{const t=localStorage.getItem("grp-timer");if(t){state.timer=JSON.parse(t);if(timerRemaining()<=-60){state.timer=null;localStorage.removeItem("grp-timer")}else{scheduleTick()}}}catch(e){}}
function timerRemaining(){if(!state.timer)return 0;return state.timer.total-(Date.now()-state.timer.startTime)/1000}
function startTimer(name,rest){
  clearTimeout(state.timerTimeout);
  const secs=parseRest(rest);
  state.timer={name,total:secs,startTime:Date.now()};
  saveTimer();
  scheduleTick();
  renderTimer()
}
function cancelTimer(){clearTimeout(state.timerTimeout);state.timer=null;saveTimer();renderTimer()}
function startTimerByIdx(idx){const ex=PROGRAM.days.find(d=>d.id===state.day).exercises[idx];startTimer(ex.name,ex.rest)}
function scheduleTick(){
  clearTimeout(state.timerTimeout);
  if(!state.timer)return;
  const rem=timerRemaining();
  if(rem<=-1)return; // stop scheduling once well past zero
  // Align to next whole-second boundary
  const ms=((rem%1)*1000)||1000;
  state.timerTimeout=setTimeout(()=>{renderTimer();scheduleTick()},Math.max(50,ms))
}
function renderTimer(){
  const el=document.getElementById("timer-float");
  if(!state.timer){el.classList.remove("active");return}
  el.classList.add("active");
  const rem=timerRemaining();const done=rem<=0;const display=Math.max(0,Math.ceil(rem));
  el.style.background=done?"#1a2a1a":"#141416";
  el.style.border="1px solid "+(done?"#2a4a2a":"#2a2a30");
  document.getElementById("timer-name").textContent=state.timer.name;
  const timeEl=document.getElementById("timer-time");
  timeEl.textContent=done?"GO!":`${Math.floor(display/60)}:${(display%60).toString().padStart(2,"0")}`;
  timeEl.style.color=done?"#5cb85c":"#f0f0f2";
  const fill=document.getElementById("timer-fill");
  fill.style.width=`${Math.min(100,((state.timer.total-rem)/state.timer.total)*100)}%`;
  fill.style.background=done?"#5cb85c":"#f0f0f2"
}
// Recompute immediately when the tab/screen becomes visible again
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&state.timer){renderTimer();scheduleTick()}});

// Photo upload
function handlePhoto(input){
  const file=input.files?.[0];if(!file)return;
  if(state.photos.length>=MAX_PHOTOS){alert("Photo limit reached ("+MAX_PHOTOS+").");input.value="";return}
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();img.onload=()=>{
      const canvas=document.createElement("canvas");const max=600;let w=img.width,h=img.height;
      if(w>h){if(w>max){h=h*max/w;w=max}}else{if(h>max){w=w*max/h;h=max}}
      canvas.width=w;canvas.height=h;canvas.getContext("2d").drawImage(img,0,0,w,h);
      state.photos.unshift({id:Date.now().toString(),date:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}),data:canvas.toDataURL("image/jpeg",.6)});
      savePhotos();render()
    };img.src=e.target.result
  };reader.readAsDataURL(file);input.value=""
}
function deletePhoto(id){if(!confirm("Delete this photo?"))return;state.photos=state.photos.filter(p=>p.id!==id);savePhotos();render()}

// Export
function generateExport(){
  let t=`GOLDEN RATIO PROTOCOL — MONTH ${PROGRAM.month} LOG\nClient: Eric\nExported: ${new Date().toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}\nSessions: ${totalSessions()} | Sets Logged: ${totalSetsCount()} | Progress Photos: ${state.photos.length}\n${"═".repeat(46)}\n\n`;
  const sorted=Object.keys(state.logs).sort();let has=false;
  for(const key of sorted){
    const log=state.logs[key];const di=PROGRAM.days.find(d=>d.id===log.day);if(!di)continue;
    if(!log.exercises?.some(ex=>ex.sets?.some(hasSetData)))continue;has=true;
    t+=`${di.label} — ${di.title}  [${log.date}]\n${"-".repeat(42)}\n`;
    if(log.notes)t+=`  Notes: ${log.notes}\n`;
    for(const ex of log.exercises){
      const done=ex.sets?.filter(hasSetData);if(!done?.length)continue;t+=`  ${ex.name}\n`;
      done.forEach((s,i)=>{
        if(s.a){
          const p=ex.parts||["A","B"];
          const aS=s.aBw?`BW × ${s.a.reps||"—"} reps`:`${s.a.weight||"—"} lbs × ${s.a.reps||"—"} reps`;
          const bS=s.bBw?`BW × ${s.b.reps||"—"} reps`:`${s.b.weight||"—"} lbs × ${s.b.reps||"—"} reps`;
          t+=`    Set ${i+1}: ${p[0]}: ${aS}\n           ${p[1]}: ${bS}\n`
        }else{t+=`    Set ${i+1}: ${s.bw?"BW":(s.weight||"—")+" lbs"} × ${s.reps||"—"} reps\n`}
      })
    }
    t+="\n"
  }
  if(!has)t+="No sessions logged yet.\n";
  if(state.photos.length>0)t+=`${"═".repeat(46)}\n📸 ${state.photos.length} progress photo${state.photos.length!==1?"s":""} taken this month.\nRemember to send your progress photos to your coach along with this summary.\n`;
  showModal(t)
}
function showModal(text){
  document.getElementById("modal").innerHTML=`<div class="modal-content"><div class="modal-hdr"><span>COACH SUMMARY</span><button onclick="hideModal()">✕</button></div><textarea readonly>${text}</textarea><button class="copy-btn" onclick="copyExport(this)">Copy to Clipboard</button><div class="hint">Paste this into a text or email to your coach</div></div>`;
  document.getElementById("modal").classList.remove("hidden");
  document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")hideModal()}
}
function hideModal(){document.getElementById("modal").classList.add("hidden")}
function copyExport(btn){
  const ta=document.getElementById("modal").querySelector("textarea");
  try{navigator.clipboard.writeText(ta.value)}catch(e){ta.select();document.execCommand("copy")}
  btn.textContent="Copied!";setTimeout(()=>btn.textContent="Copy to Clipboard",2200)
}

// RENDER
function render(){
  document.getElementById("profile-img").src=PHOTOS.profile;
  renderNav();
  if(state.view==="workout")renderWorkout();
  else if(state.view==="progress")renderProgress();
  else renderExport();
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id==="view-"+state.view))
}

function renderNav(){
  const tabs=[{id:"workout",label:"Workout"},{id:"progress",label:"Progress"},{id:"export",label:"Coach"}];
  document.getElementById("nav").innerHTML=tabs.map(t=>`<button class="${state.view===t.id?"a":""}" onclick="setView('${t.id}')">${t.label}</button>`).join("")
}
function setView(v){state.view=v;render()}

const ILL_MAP={"Weighted Neutral-Grip Pull-Up":"pullup","Low-to-High Cable Flye":"flye","Wide-Grip Lat Pulldown":"pulldown","Straight-Arm Cable Pulldown":"straight-arm","Reverse Pec Deck":"rear-delt","Hanging Leg Raise + Hollow Rock":"hang-core","Barbell Hip Thrust":"hip-thrust","Single-Leg Romanian Deadlift":"sl-hinge","Standing Calf Raise":"calf-raise","Incline DB Curl + Rope Pushdown":"curl-standing","Hammer Curl + Single-Arm Cable Kickback":"kickback","Chest-Supported Row":"row-bent","Single-Arm Cable Row":"row-seated","Heavy DB Shrugs":"shrug","Cable Lateral Raise":"raise-lateral","Rear Delt Cable Flye":"rear-delt","Hack Squat":"squat-machine","Weighted Walking Lunge":"lunge","Cable Face Pull":"rear-delt","DB Lateral Raise":"raise-lateral","Preacher Curl + V-Bar Pushdown":"pushdown","Cable Curl + Single-Arm Reverse-Grip Pushdown":"curl-standing","Ab Rollout + Hollow Hold":"rollout"};
function illus(name){
  const k=ILL_MAP[name];if(!k)return"";
  const o=ILL[k];if(!o)return"";
  return `<div class="illus"><svg viewBox="0 0 140 110" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${o.eq||""}${ILL_FIG(o.f)}</svg></div>`;
}
function renderWC(type,data){
  if(!data)return"";
  const id=type+"-"+state.day;
  const open=state.expanded[id];
  const label=type==="warmup"?"WARM-UP":"COOL-DOWN";
  const cls=type==="cooldown"?" cool":"";
  let h=`<div class="wc-card${cls}"><div class="wc-hdr" onclick="toggle('${id}')"><div><span class="wc-tag">${label}</span><span class="wc-title">${data.title}</span></div><span class="chev ${open?"open":""}">▾</span></div>`;
  if(open){
    h+=`<div class="wc-body">`;
    data.items.forEach((it,i)=>{
      h+=`<div class="wc-item"><div class="wc-n">${i+1}</div><div class="wc-c"><div class="wc-name">${it.n}<span class="wc-d">· ${it.d}</span></div><div class="wc-cue">${it.c}</div></div></div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;
  return h;
}
function renderWorkout(){
  const day=PROGRAM.days.find(d=>d.id===state.day);const k=logKey();const log=state.logs[k];
  const last=getLastSession(state.day);
  let h=`<div class="days">`;
  PROGRAM.days.forEach(d=>{
    const c=isDayComplete(d.id);
    h+=`<button class="day-btn ${state.day===d.id?"a":""}" onclick="setDay('${d.id}')">${d.label}${c?'<span class="day-dot"></span>':""}</button>`
  });
  h+=`</div><div class="day-title">${day.title}</div>`;
  h+=`<div class="date-row"><input type="date" value="${state.date}" onchange="setDate(this.value)"><span>${new Date(state.date+"T12:00").toLocaleDateString("en-US",{weekday:"long"})}</span></div>`;
  if(last)h+=`<div class="autofill"><button onclick="autoFill()">↻ Load Last Session's Weights</button></div>`;

  h+=renderWC("warmup",WARMUPS[state.day]);

  day.exercises.forEach((ex,exIdx)=>{
    const id=state.day+"-"+exIdx;const open=state.expanded[id];const gOpen=state.guides[id];
    const filled=filledCount(log,exIdx);
    const tagHtml=ex.tag?`<span class="tag ${ex.tag==="SUPERSET"?"tag-ss":"tag-ks"}">${ex.tag}</span>`:"";
    h+=`<div class="card"><div class="card-hdr" onclick="toggle('${id}')"><div><div><span class="card-name">${ex.name}</span>${tagHtml}</div><div class="card-meta">${ex.muscles} · ${ex.sets} × ${ex.reps}${filled>0?`<span class="logged">${filled}/${ex.sets} logged</span>`:""}</div></div><span class="chev ${open?"open":""}">▾</span></div>`;
    if(open){
      h+=`<div><div class="info-bar"><span>Tempo: <b>${ex.tempo}</b></span><span>Rest: <b>${ex.rest}</b></span><span>${ex.sets} × ${ex.reps}</span></div>`;
      h+=illus(ex.name);
      h+=`<div class="guide-toggle" onclick="toggleGuide('${id}')"><span>FORM GUIDE</span><span class="chev ${gOpen?"open":""}">▾</span></div>`;
      if(gOpen){h+=`<div class="guide">`;ex.cues.forEach((c,ci)=>{h+=`<div class="guide-step"><span class="n">${ci+1}</span><span class="t">${c}</span></div>`});h+=`</div>`}

      for(let si=0;si<ex.sets;si++){
        const sd=log?.exercises[exIdx]?.sets[si]||{};
        if(ex.parts){
          const aD=sd.a||{},bD=sd.b||{},aBw=ex.partsBw?.[0],bBw=ex.partsBw?.[1];
          const filled2=(aBw?aD.reps:(aD.weight&&aD.reps))&&(bBw?bD.reps:(bD.weight&&bD.reps));
          h+=`<div style="border-bottom:1px solid #0e0e10">`;
          h+=`<div class="ss-label"><span class="${filled2?"done":""}" style="font-size:11px;font-weight:700;color:${filled2?"#3a7a3a":"#333"};width:32px">${si+1}</span><span>${ex.parts[0]}</span></div>`;
          h+=`<div class="ss-inputs">`;
          if(aBw){h+=`<span class="bw-badge">BW</span><span class="x">×</span><div style="flex:1;min-width:0"><input class="inp ${aD.reps?"filled":""}" type="number" inputmode="numeric" placeholder="—" value="${aD.reps||""}" oninput="updateSet(${exIdx},${si},'reps',this.value,'a')" onblur="render()"><div class="inp-label">REPS</div></div>`}
          else{h+=`<div style="flex:1;min-width:0"><input class="inp ${aD.weight?"filled":""}" type="number" inputmode="decimal" placeholder="—" value="${aD.weight||""}" oninput="updateSet(${exIdx},${si},'weight',this.value,'a')" onblur="render()"><div class="inp-label">LBS</div></div><span class="x">×</span><div style="flex:1;min-width:0"><input class="inp ${aD.reps?"filled":""}" type="number" inputmode="numeric" placeholder="—" value="${aD.reps||""}" oninput="updateSet(${exIdx},${si},'reps',this.value,'a')" onblur="render()"><div class="inp-label">REPS</div></div>`}
          h+=`</div>`;
          h+=`<div class="ss-part-label"><span>${ex.parts[1]}</span></div>`;
          h+=`<div class="ss-inputs-b">`;
          if(bBw){h+=`<span class="bw-badge">BW</span><span class="x">×</span><div style="flex:1;min-width:0"><input class="inp ${bD.reps?"filled":""}" type="number" inputmode="numeric" placeholder="—" value="${bD.reps||""}" oninput="updateSet(${exIdx},${si},'reps',this.value,'b')" onblur="render()"><div class="inp-label">REPS</div></div>`}
          else{h+=`<div style="flex:1;min-width:0"><input class="inp ${bD.weight?"filled":""}" type="number" inputmode="decimal" placeholder="—" value="${bD.weight||""}" oninput="updateSet(${exIdx},${si},'weight',this.value,'b')" onblur="render()"><div class="inp-label">LBS</div></div><span class="x">×</span><div style="flex:1;min-width:0"><input class="inp ${bD.reps?"filled":""}" type="number" inputmode="numeric" placeholder="—" value="${bD.reps||""}" oninput="updateSet(${exIdx},${si},'reps',this.value,'b')" onblur="render()"><div class="inp-label">REPS</div></div>`}
          h+=`</div></div>`
        } else if(ex.bw){
          const f=!!sd.reps;
          h+=`<div class="set-row"><span class="set-num ${f?"done":""}">${si+1}</span><span class="bw-badge">BW</span><span class="x">×</span><div style="flex:1;min-width:0"><input class="inp ${sd.reps?"filled":""}" type="number" inputmode="numeric" placeholder="—" value="${sd.reps||""}" oninput="updateSet(${exIdx},${si},'reps',this.value)" onblur="render()"><div class="inp-label">REPS</div></div></div>`
        } else {
          const f=sd.weight&&sd.reps;const pr=isNewPR(ex.name,sd.weight);
          h+=`<div class="set-row"><span class="set-num ${f?"done":""}">${si+1}</span><div style="flex:1;min-width:0"><input class="inp ${pr?"pr":sd.weight?"filled":""}" type="number" inputmode="decimal" placeholder="—" value="${sd.weight||""}" oninput="updateSet(${exIdx},${si},'weight',this.value)" onblur="render()"><div class="inp-label">${pr?'<span class="pr-label">★ PR</span>':"LBS"}</div></div><span class="x">×</span><div style="flex:1;min-width:0"><input class="inp ${sd.reps?"filled":""}" type="number" inputmode="numeric" placeholder="—" value="${sd.reps||""}" oninput="updateSet(${exIdx},${si},'reps',this.value)" onblur="render()"><div class="inp-label">REPS</div></div></div>`
        }
      }
      h+=`<div class="rest-wrap"><button class="rest-btn" onclick="startTimerByIdx(${exIdx})">⏱ Rest ${ex.rest}</button></div></div>`
    }
    h+=`</div>`
  });

  h+=renderWC("cooldown",COOLDOWNS[state.day]);

  const notes=log?.notes||"";
  h+=`<div class="notes-box"><label>SESSION NOTES (OPTIONAL)</label><textarea placeholder="How did it feel? Anything to flag for your coach..." onblur="updateNotes(this.value)">${notes}</textarea></div>`;
  const allDone=log?.exercises?.every(ex=>ex?.sets?.every(isSetFilled));
  if(allDone)h+=`<div class="complete-banner"><div class="t">✓ SESSION COMPLETE</div><div class="s">${day.title} — all sets logged</div></div>`;

  document.getElementById("view-workout").innerHTML=h
}

function renderProgress(){
  const ts=totalSessions(),tsets=totalSetsCount();
  let h=`<div class="sec-title">Stats</div><div class="stat-grid c2"><div class="stat"><div class="n">${ts}</div><div class="l">Sessions</div></div><div class="stat"><div class="n">${tsets}</div><div class="l">Sets Logged</div></div></div>`;
  h+=`<div class="sec-title">Starting Point · Month ${PROGRAM.month}</div><div class="photo-grid">`;
  PROGRAM.progressPhotos.forEach(p=>{h+=`<div class="photo-card"><img src="${p.src}"><div class="overlay">${p.label}</div></div>`});
  h+=`</div>`;
  h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:20px 20px 10px"><div class="sec-title" style="padding:0">My Progress Photos</div><span style="font-size:11px;color:#333">${state.photos.length} photo${state.photos.length!==1?"s":""}</span></div>`;
  h+=`<div style="padding:0 16px 12px">`;
  if(state.photos.length<MAX_PHOTOS){h+=`<label class="upload-label"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>Add Progress Photo<input type="file" accept="image/*" onchange="handlePhoto(this)"></label>`}
  else{h+=`<div class="upload-limit">Photo limit reached (${MAX_PHOTOS}). Delete older photos to add new ones.</div>`}
  h+=`</div>`;
  if(state.photos.length>0){h+=`<div class="photo-grid">`;state.photos.forEach(p=>{h+=`<div class="photo-card"><img src="${p.data}"><div class="overlay"><div class="overlay-row"><span>${p.date}</span><button class="del" onclick="deletePhoto('${p.id}')">✕</button></div></div></div>`});h+=`</div>`}
  else{h+=`<div class="empty-photos">Tap above to add your first progress photo</div>`}
  document.getElementById("view-progress").innerHTML=h
}

function renderExport(){
  const ts=totalSessions(),tsets=totalSetsCount();
  let h=`<div class="sec-title">Send to Coach</div><div class="coach-desc">Export your training log so your coach can review your progress and build your next month's program.</div>`;
  h+=`<div class="stat-grid c3"><div class="stat"><div class="n">${ts}</div><div class="l">Sessions</div></div><div class="stat"><div class="n">${tsets}</div><div class="l">Sets</div></div><div class="stat"><div class="n">${state.photos.length}</div><div class="l">Photos</div></div></div>`;
  if(state.photos.length>0)h+=`<div class="photo-remind">📸 Remember to send your ${state.photos.length} progress photo${state.photos.length!==1?"s":""} to your coach along with the summary below.</div>`;
  h+=`<button class="export-btn" onclick="generateExport()">Generate Coach Summary</button>`;
  document.getElementById("view-export").innerHTML=h
}

function setDay(id){state.day=id;state.date=getMostRecent(id);state.expanded={};state.guides={};render()}
function setDate(v){state.date=v;render()}
function toggle(id){state.expanded[id]=!state.expanded[id];render()}
function toggleGuide(id){state.guides[id]=!state.guides[id];render()}

// Init
state.day=getAutoDay();state.date=getMostRecent(state.day);
load();loadTimer();render();

</script>
